apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich
  namespace: immich
spec:
  interval: 10m
  chartRef:
    kind: OCIRepository
    name: immich
  values:
    immich:
      persistence:
        library:
          existingClaim: immich-library
    valkey:
      enabled: true
    server:
      ingress:
        main:
          enabled: true
          className: tailscale
          annotations: {}
          hosts:
          - host: immich
            paths:
            - path: /
              service:
                identifier: main
          tls:
          - hosts:
            - immich
      controllers:
        main:
          containers:
            main:
              image:
                tag: v3.3.5
              env:
                DB_HOSTNAME:
                  valueFrom:
                    secretKeyRef:
                      name: immich-pg-app
                      key: host
                DB_PORT:
                  valueFrom:
                    secretKeyRef:
                      name: immich-pg-app
                      key: port
                DB_DATABASE_NAME:
                  valueFrom:
                    secretKeyRef:
                      name: immich-pg-app
                      key: dbname
                DB_USERNAME:
                  valueFrom:
                    secretKeyRef:
                      name: immich-pg-app
                      key: username
                DB_PASSWORD:
                  valueFrom:
                    secretKeyRef:
                      name: immich-pg-app
                      key: password
    machine-learning:
      controllers:
        main:
          containers:
            main:
              resources:
                requests:
                  cpu: '1'
                  memory: 4Gi
                limits:
                  memory: 6Gi
      persistence:
        cache:
          enabled: true
          type: persistentVolumeClaim
          accessMode: ReadWriteOnce
          storageClass: nfs-csi
          size: 10Gi
