apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: media-server
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./apps/base/media-server
  patches:
  - target:
      group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    patch: |
      apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      metadata:
        name: ignored
        annotations:
          kustomize.toolkit.fluxcd.io/substitute: disabled
  postBuild:
    substituteFrom:
     - kind: ConfigMap
       name: cluster-vars
       optional: true
  prune: false
  suspend: true
  sourceRef:
    kind: GitRepository
    name: media-server
  targetNamespace: media-server
