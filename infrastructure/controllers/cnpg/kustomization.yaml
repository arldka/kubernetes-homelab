apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
# patch-only: a minor bump also changes the release-1.NN path segment, edit it by hand
# renovate: datasource=github-releases depName=cloudnative-pg/cloudnative-pg extractVersion=^v(?<version>1\.30\.\d+)$
- https://raw.githubusercontent.com/cloudnative-pg/cloudnative-pg/release-1.30/releases/cnpg-1.30.1.yaml
patches:
  - target:
      group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    patch: |-
      apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      metadata:
        name: not-important
        annotations:
          kustomize.toolkit.fluxcd.io/substitute: disabled
