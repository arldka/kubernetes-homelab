apiVersion: apps/v1
kind: Deployment
metadata:
  name: paperless
  namespace: paperless
spec:
  replicas: 1
  strategy:
    type: Recreate # sqlite on a RWO volume
  selector:
    matchLabels:
      app: paperless
  template:
    metadata:
      labels:
        app: paperless
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: paperless
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        image: ghcr.io/paperless-ngx/paperless-ngx:3.4.2
        ports:
        - name: http
          containerPort: 8000
        env:
        - name: PAPERLESS_PORT
          value: "8000"
        - name: PAPERLESS_URL
          value: https://paperless.${TAILNET}
        - name: PAPERLESS_REDIS
          value: redis://paperless-valkey:6379
        - name: PAPERLESS_DBENGINE
          value: sqlite
        - name: PAPERLESS_DATA_DIR
          value: /usr/src/paperless/data
        - name: PAPERLESS_MEDIA_ROOT
          value: /usr/src/paperless/media
        - name: PAPERLESS_CONSUMPTION_DIR
          value: /usr/src/paperless/consume
        - name: PAPERLESS_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: paperless-secret
              key: secret-key
        volumeMounts:
        - name: data
          mountPath: /usr/src/paperless/data
        - name: media
          mountPath: /usr/src/paperless/media
        - name: consume
          mountPath: /usr/src/paperless/consume
        - name: export
          mountPath: /usr/src/paperless/export
        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 30
        resources:
          requests:
            cpu: 250m
            memory: 1Gi
          limits:
            memory: 2Gi
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: paperless-data
      - name: media
        persistentVolumeClaim:
          claimName: paperless-media
      - name: consume
        persistentVolumeClaim:
          claimName: paperless-consume
      - name: export
        persistentVolumeClaim:
          claimName: paperless-export
---
apiVersion: v1
kind: Service
metadata:
  name: paperless
  namespace: paperless
spec:
  selector:
    app: paperless
  ports:
  - name: http
    port: 80
    targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: paperless
  namespace: paperless
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: paperless
      port:
        number: 80
  tls:
  - hosts:
    - paperless
