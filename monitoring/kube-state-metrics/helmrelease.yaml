
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-state-metrics
  namespace: monitoring
spec:
  interval: 10m
  chartRef:
    kind: OCIRepository
    name: kube-state-metrics
  uninstall:
    deletionPropagation: orphan
  values:
    prometheusScrape: false
    prometheus:
      monitor:
        enabled: true
    networkPolicy:
      enabled: false
      ingress:
        - from:
          ports:
            - {protocol: TCP, port: 8080}
            - {protocol: TCP, port: 8081}
