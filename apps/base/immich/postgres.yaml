apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: immich-pg
  namespace: immich
spec:
  instances: 1
  imageName: ghcr.io/immich-app/postgres:17-vectorchord1.1.1-pgvector0.8.5
  # Debian-based postgres image: postgres user is 999, not CNPG's default 26
  postgresUID: 999
  postgresGID: 999
  bootstrap:
    initdb:
      database: immich
      owner: immich
      postInitApplicationSQL:
      - CREATE EXTENSION IF NOT EXISTS vchord CASCADE;
      - CREATE EXTENSION IF NOT EXISTS cube CASCADE;
      - CREATE EXTENSION IF NOT EXISTS earthdistance CASCADE;
  postgresql:
    shared_preload_libraries:
    - vchord.so
  storage:
    size: 10Gi
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1Gi
