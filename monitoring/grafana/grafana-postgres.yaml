apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: grafana-pg
  namespace: monitoring
spec:
  instances: 1
  bootstrap:
    initdb:
      database: grafana
      owner: grafana
  storage:
    size: 2Gi
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi
